<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Credenciales IPN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/styles.css"> 
</head>
<body>
    <div class="container">
        <!-- Panel de Control -->
        <div class="control-panel">
            <h2>📝 Editor de Credencial</h2>
            
            <div class="form-group">
                <label for="photoUpload">📸 Foto del Estudiante</label>
                <div class="file-input-wrapper">
                    <input type="file" id="photoUpload" class="file-input" accept="image/*">
                    <button type="button" class="file-input-button" onclick="document.getElementById('photoUpload').click()">
                        Subir Fotografía
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="nameInput">👤 Nombre Completo</label>
                <input type="text" id="nameInput" placeholder="APELLIDOS NOMBRE">
            </div>

            <div class="form-group">
                <label for="boletaInput">🔢 Número de Boleta</label>
                <input type="text" id="boletaInput" placeholder="2022601075" maxlength="15">
            </div>

            <div class="form-group">
                <label for="programSelect">📚 Programa Académico</label>
                <select id="programSelect">
                    <option value="">Seleccionar programa...</option>
                    <option value="INGENIERÍA EN INFORMÁTICA">INGENIERÍA EN INFORMÁTICA</option>
                    <option value="INGENIERÍA INDUSTRIAL">INGENIERÍA INDUSTRIAL</option>
                    <option value="INGENIERÍA EN SISTEMAS COMPUTACIONALES">INGENIERÍA EN SISTEMAS COMPUTACIONALES</option>
                    <option value="LICENCIATURA EN CIENCIAS DE LA INFORMÁTICA">LICENCIATURA EN CIENCIAS DE LA INFORMÁTICA</option>
                    <option value="INGENIERÍA EN TRANSPORTE">INGENIERÍA EN TRANSPORTE</option>
                    <option value="CONTADOR PÚBLICO">CONTADOR PÚBLICO</option>
                    <option value="LICENCIATURA EN ADMINISTRACIÓN INDUSTRIAL">LICENCIATURA EN ADMINISTRACIÓN INDUSTRIAL</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" id="customProgram" placeholder="O escribir programa personalizado..." style="display: none;">
            </div>

            <button class="btn btn-download" onclick="downloadCredential()">
                💾 Descargar Credencial
            </button>
            
            <button class="btn btn-reset" onclick="resetFields()">
                🔄 Limpiar Campos
            </button>

            <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 0.85rem; color: #666;">
                <strong>💡 Instrucciones:</strong><br>
                • Haz clic directamente en los campos de la credencial para editarlos<br>
                • Usa el panel lateral para opciones adicionales<br>
                • La vista previa se actualiza en tiempo real
            </div>
        </div>

        <!-- Credencial Editable -->
        <div class="credential-wrapper">
            <div class="credential-container" id="credentialContainer">
                <!-- Imagen de fondo fija -->
                <img src="IMG/IMAGEN DE FONDO.jpeg" 
                    alt="Credencial IPN" 
                    class="credential-background">
                alt="Credencial IPN" 
                     class="credential-background">

                <!-- Foto del estudiante -->
               <img class="student-photo" id="studentPhotoImg" src="" alt="Foto del estudiante" style="display:none;">
                <!-- Campos editables superpuestos -->
                <input type="text" 
                       class="editable-field field-name" 
                       id="fieldName"
                       placeholder="NOMBRE DEL ESTUDIANTE"
                       maxlength="35">

                <input type="text" 
                       class="editable-field field-boleta" 
                       id="fieldBoleta"
                       placeholder="0000000000"
                       maxlength="15">

                <textarea class="editable-field field-program" 
                          id="fieldProgram"
                          placeholder="PROGRAMA ACADÉMICO"
                          maxlength="80"
                          rows="2"></textarea>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Generando credencial...</p>
        </div>
    </div>

    <script>
        // Variables globales
        let currentPhoto = null;

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            console.log('📝 Editor de Credenciales IPN iniciado');
        });

        // Configurar event listeners
        function setupEventListeners() {
            // Upload de foto
            document.getElementById('photoUpload').addEventListener('change', handlePhotoUpload);
            
            // Sincronización entre campos del panel y campos superpuestos
            document.getElementById('nameInput').addEventListener('input', syncNameField);
            document.getElementById('boletaInput').addEventListener('input', syncBoletaField);
            document.getElementById('programSelect').addEventListener('change', syncProgramField);
            document.getElementById('customProgram').addEventListener('input', syncCustomProgram);
            
            // Campos editables directos
            document.getElementById('fieldName').addEventListener('input', syncFromField);
            document.getElementById('fieldBoleta').addEventListener('input', syncFromField);
            document.getElementById('fieldProgram').addEventListener('input', syncFromField);
            
            // Validaciones en tiempo real
            document.getElementById('boletaInput').addEventListener('input', validateBoleta);
            document.getElementById('fieldBoleta').addEventListener('input', validateBoleta);
        }

        // Manejo de upload de foto
               function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('⚠️ La imagen es demasiado grande. Por favor, selecciona una imagen menor a 5MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhoto = e.target.result;
                    const photoImg = document.getElementById('studentPhotoImg');
                    photoImg.src = currentPhoto;
                    photoImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // Sincronización desde campos del panel hacia campos superpuestos
        function syncNameField() {
            const value = document.getElementById('nameInput').value.toUpperCase();
            document.getElementById('fieldName').value = value;
        }

        function syncBoletaField() {
            const value = document.getElementById('boletaInput').value;
            document.getElementById('fieldBoleta').value = value;
        }

        function syncProgramField() {
            const select = document.getElementById('programSelect');
            const customInput = document.getElementById('customProgram');
            
            if (select.value === '') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
                document.getElementById('fieldProgram').value = select.value;
            }
        }

        function syncCustomProgram() {
            const value = document.getElementById('customProgram').value.toUpperCase();
            document.getElementById('fieldProgram').value = value;
        }

        // Sincronización desde campos superpuestos hacia panel
        function syncFromField(event) {
            const field = event.target;
            const value = field.value;
            
            switch(field.id) {
                case 'fieldName':
                    document.getElementById('nameInput').value = value;
                    break;
                case 'fieldBoleta':
                    document.getElementById('boletaInput').value = value;
                    break;
                case 'fieldProgram':
                    document.getElementById('customProgram').value = value;
                    document.getElementById('programSelect').value = '';
                    document.getElementById('customProgram').style.display = 'block';
                    break;
            }
        }

        // Validación de boleta (solo números)
        function validateBoleta(event) {
            const input = event.target;
            const value = input.value.replace(/[^0-9]/g, '');
            
            if (input.value !== value) {
                input.value = value;
                // Sincronizar el otro campo
                if (input.id === 'boletaInput') {
                    document.getElementById('fieldBoleta').value = value;
                } else {
                    document.getElementById('boletaInput').value = value;
                }
            }
        }

        // Limpiar todos los campos
        function resetFields() {
            // Limpiar inputs del panel
            document.getElementById('photoUpload').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('boletaInput').value = '';
            document.getElementById('programSelect').value = '';
            document.getElementById('customProgram').value = '';
            document.getElementById('customProgram').style.display = 'none';
            
            // Limpiar campos superpuestos
            document.getElementById('fieldName').value = '';
            document.getElementById('fieldBoleta').value = '';
            document.getElementById('fieldProgram').value = '';
            
            // Limpiar foto
            currentPhoto = null;
            document.getElementById('studentPhoto').innerHTML = 'Sin foto';
            
            console.log('🔄 Campos limpiados');
        }

        // Descargar credencial
        async function downloadCredential() {
            const name = document.getElementById('fieldName').value;
            const boleta = document.getElementById('fieldBoleta').value;
            
            if (!name || !boleta) {
                alert('⚠️ Por favor, completa al menos el nombre y número de boleta antes de descargar.');
                return;
            }

            if (boleta.length < 6) {
                alert('⚠️ El número de boleta debe tener al menos 6 dígitos.');
                return;
            }

            // Mostrar loading
            document.getElementById('loading').style.display = 'flex';

            try {
                // Temporalmente ocultar focus styles para la captura
                const credential = document.getElementById('credentialContainer');
                const editableFields = credential.querySelectorAll('.editable-field');
                
                editableFields.forEach(field => {
                    field.style.background = 'transparent';
                    field.style.boxShadow = 'none';
                    field.blur();
                });

                // Generar imagen con alta calidad
                const canvas = await html2canvas(credential, {
                    scale: 3, // Alta resolución
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff',
                    width: 400,
                    height: 600,
                    logging: false
                });

                // Crear enlace de descarga
                const link = document.createElement('a');
                const fileName = `Credencial_${name.replace(/\s+/g, '_')}_${boleta}.png`;
                link.download = fileName;
                link.href = canvas.toDataURL('image/png', 1.0);
                
                // Descargar
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                console.log(`✅ Credencial descargada: ${fileName}`);
                alert('✅ ¡Credencial descargada exitosamente!');

            } catch (error) {
                console.error('❌ Error al generar la credencial:', error);
                alert('❌ Error al generar la credencial. Por favor, intenta nuevamente.');
            } finally {
                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
